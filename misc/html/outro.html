<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Welcome</title>
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: "MutatorSans", sans-serif;
    }

    #intro {
      width: 80%;
      max-width: 600px;
      margin: 20px;
      text-align: center;
    }

    #explanation {
      text-align: left;
      background: #f5f5f5;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 20px 0;
      white-space: pre-wrap;
    }

    a.questionnaire-link {
      display: inline-block;
      margin: 10px 0 20px 0;
    }

    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div id="outro">
    <h1>Welcome</h1>

    <!-- Free-form explanation of the experiment. Edit misc/explanation_en.txt
         (loaded via the "explanation" template variable) to change this text
         without touching this page. -->

    <p>
      Thank you for participating!
      Please take a moment to fill the outro questionnaire below.
    </p>
    <a class="questionnaire-link" id="questionnaireLink" href="{{outroQuestionnaireUrl}}" target="_blank" rel="noopener">
      Open the outro questionnaire
    </a>

    <p>
    Once you have done so, you may leave.
    </p>

    <button id="startBtn">Begin</button>
  </div>

  <script>
    const nextStage = "{{nextStage}}";
    const nextLabel = "{{nextLabel}}";

    document.getElementById("startBtn").addEventListener("click", function() {
      window.location.href = "/" + nextStage;
    });

    if (nextLabel) {
      document.getElementById("startBtn").textContent = nextLabel;
    }
  </script>
</body>
</html>
